name: UI visual and accessibility QA

on:
  workflow_dispatch:
    inputs:
      frontend-ref:
        description: Frontend branch or commit to inspect (select the matching feature ref)
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: dev-workflow

      - uses: actions/checkout@v4
        with:
          repository: vista-pdg/frontend
          ref: ${{ inputs.frontend-ref }}
          path: frontend
          token: ${{ secrets.VISTA_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            dev-workflow/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm ci
        working-directory: dev-workflow

      - run: npx playwright install --with-deps chromium
        working-directory: dev-workflow

      - run: npx playwright test --workers=1
        working-directory: dev-workflow

      - name: Visual diffs, traces, and axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-report
          path: |
            dev-workflow/playwright-report
            dev-workflow/test-results
          if-no-files-found: ignore
