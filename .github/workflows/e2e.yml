# Flujo reutilizable: levanta VISTA completo (Postgres + backend + frontend) y corre Cypress.
#
# Lo llaman tanto vista-pdg/backend como vista-pdg/frontend. Es la única pieza de CI que de verdad
# comparten: la orquestación de dos repositorios. Lo específico de cada stack (Maven y JaCoCo, npm y
# typecheck) se queda en cada repositorio, donde un fallo se lee sin abrir un segundo proyecto.
name: VISTA · End-to-end

on:
  workflow_call:
    inputs:
      backend-ref:
        description: Ref (rama, tag o SHA) de vista-pdg/backend
        type: string
        default: main
      frontend-ref:
        description: Ref (rama, tag o SHA) de vista-pdg/frontend
        type: string
        default: main
      browsers:
        description: Navegadores de Cypress, como array JSON
        type: string
        default: '["chrome","firefox"]'
    secrets:
      VISTA_REPO_TOKEN:
        description: >-
          Token de solo lectura (contents:read) sobre vista-pdg/backend y vista-pdg/frontend.
          Ambos repositorios son privados y el GITHUB_TOKEN del llamador solo alcanza su propio repo.
        required: true

jobs:
  cypress:
    name: Cypress · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vista_pdg
          POSTGRES_USER: vista
          POSTGRES_PASSWORD: vista123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vista -d vista_pdg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Backend (${{ inputs.backend-ref }})
        uses: actions/checkout@v4
        with:
          repository: vista-pdg/backend
          ref: ${{ inputs.backend-ref }}
          path: backend
          token: ${{ secrets.VISTA_REPO_TOKEN }}

      - name: Frontend (${{ inputs.frontend-ref }})
        uses: actions/checkout@v4
        with:
          repository: vista-pdg/frontend
          ref: ${{ inputs.frontend-ref }}
          path: frontend
          token: ${{ secrets.VISTA_REPO_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Perfil e2e: /api/generate responde un grafo fijo. Sin clave de Gemini, sin red, sin cuota.
      - name: Arrancar backend (perfil e2e)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: e2e
        run: nohup ./mvnw -B -ntp spring-boot:run > backend.log 2>&1 &

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Esperar al backend
        run: |
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8080/api/courses > /dev/null; then
              echo "backend arriba tras $((i*3)) s"; exit 0
            fi
            sleep 3
          done
          echo "::error::el backend no respondió en 5 minutos"
          tail -n 200 backend/backend.log
          exit 1

      - name: Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173/login'
          wait-on-timeout: 120
          browser: ${{ matrix.browser }}

      - name: Capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Log del backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.browser }}
          path: backend/backend.log
          if-no-files-found: ignore
