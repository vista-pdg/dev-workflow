# Flujo reutilizable: levanta VISTA completo (Postgres + backend + frontend) y corre Cypress.
#
# Lo llaman tanto vista-pdg/backend como vista-pdg/frontend. Es la única pieza de CI que de verdad
# comparten: la orquestación de dos repositorios. Lo específico de cada stack (Maven y JaCoCo, npm y
# typecheck) se queda en cada repositorio, donde un fallo se lee sin abrir un segundo proyecto.
name: VISTA · End-to-end

on:
  workflow_call:
    inputs:
      backend-ref:
        description: >-
          Ref de vista-pdg/backend. `auto` = la rama del mismo nombre que la del llamador si existe
          allí, y si no `main`. Dos historias que aterrizan juntas comparten nombre de rama en ambos
          repos, y probar la rama de un repo contra el main del otro solo mide el desfase entre ellas.
        type: string
        default: auto
      frontend-ref:
        description: Ref de vista-pdg/frontend. Misma regla que backend-ref.
        type: string
        default: auto
      browsers:
        description: Navegadores de Cypress, como array JSON
        type: string
        default: '["chrome","firefox"]'
    secrets:
      VISTA_REPO_TOKEN:
        description: >-
          Token de solo lectura (contents:read) sobre vista-pdg/backend y vista-pdg/frontend.
          Ambos repositorios son privados y el GITHUB_TOKEN del llamador solo alcanza su propio repo.
        required: true

jobs:
  cypress:
    name: Cypress · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vista_pdg
          POSTGRES_USER: vista
          POSTGRES_PASSWORD: vista123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vista -d vista_pdg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # HU-32: memoria conversacional del asistente. Sin Redis el backend arranca igual y degrada,
      # pero entonces los escenarios de refinamiento no probarían nada.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      # El nombre de rama del llamador entra por variable de entorno y entre comillas: nunca se
      # interpola dentro del script.
      - name: Resolver refs (rama pareja si existe, si no main)
        id: refs
        env:
          WANTED: ${{ github.head_ref || github.ref_name }}
          BACKEND_REF: ${{ inputs.backend-ref }}
          FRONTEND_REF: ${{ inputs.frontend-ref }}
          TOKEN: ${{ secrets.VISTA_REPO_TOKEN }}
        run: |
          resolve() {
            if [ "$2" != "auto" ]; then echo "$2"; return; fi
            if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/vista-pdg/$1.git" "refs/heads/${WANTED}" > /dev/null 2>&1; then
              echo "$WANTED"
            else
              echo "main"
            fi
          }
          b=$(resolve backend "$BACKEND_REF")
          f=$(resolve frontend "$FRONTEND_REF")
          echo "backend=$b" >> "$GITHUB_OUTPUT"
          echo "frontend=$f" >> "$GITHUB_OUTPUT"
          echo "backend → $b · frontend → $f"

      - name: Backend (${{ steps.refs.outputs.backend }})
        uses: actions/checkout@v4
        with:
          repository: vista-pdg/backend
          ref: ${{ steps.refs.outputs.backend }}
          path: backend
          token: ${{ secrets.VISTA_REPO_TOKEN }}

      - name: Frontend (${{ steps.refs.outputs.frontend }})
        uses: actions/checkout@v4
        with:
          repository: vista-pdg/frontend
          ref: ${{ steps.refs.outputs.frontend }}
          path: frontend
          token: ${{ secrets.VISTA_REPO_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Perfil e2e: /api/generate responde un grafo fijo. Sin clave de Gemini, sin red, sin cuota.
      - name: Arrancar backend (perfil e2e)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: e2e
        run: nohup ./mvnw -B -ntp spring-boot:run > backend.log 2>&1 &

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci

      # Cualquier código HTTP vale como señal de vida: una sonda a un endpoint concreto se acopla
      # a la versión del backend que lo tenga (con `main` anterior a HU-16, /api/courses daba 401
      # y la espera agotaba los cinco minutos con el backend perfectamente arriba).
      - name: Esperar al backend
        run: |
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
                     -H 'Content-Type: application/json' -d '{}' || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "backend arriba tras $((i*3)) s (HTTP $code)"; exit 0
            fi
            sleep 3
          done
          echo "::error::el backend no respondió en 5 minutos"
          tail -n 200 backend/backend.log
          exit 1

      - name: Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173/login'
          wait-on-timeout: 120
          browser: ${{ matrix.browser }}

      - name: Capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Log del backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.browser }}
          path: backend/backend.log
          if-no-files-found: ignore
